# amux palette "acid" — lime / mint on black-green
# Switch live with prefix+T, or: tmux source-file ~/amux/themes/acid.conf

# Colour variables for your own formats: #{@amux_a1}, #{@amux_a2}, #{@amux_dim},
# #{@amux_dim2}, #{@amux_fg}, #{@amux_fg2}, #{@amux_panel}, #{@amux_bg}
set -g @amux_palette "acid"
set -g @amux_a1 "#b9ff3c"
set -g @amux_a2 "#3cffd9"
set -g @amux_bg "#091009"
set -g @amux_panel "#070d08"
set -g @amux_dim "#4f6a52"
set -g @amux_dim2 "#1c2a1e"
set -g @amux_fg "#d9dcea"
set -g @amux_fg2 "#9aa0ba"

# panes
set -g window-style "bg=#091009,fg=#d9dcea"
set -g window-active-style "bg=#091009,fg=#d9dcea"
set -g pane-border-style "fg=#{?@area_color,#{@area_color},#1c2a1e}"
set -g pane-active-border-style "fg=#{?@area_color,#{@area_color},#b9ff3c}"
set -g pane-border-format "#[fg=#{?@area_color,#{@area_color},#1c2a1e}]┤ #{?pane_active,#[fg=#b9ff3c]#[bold],#[fg=#9aa0ba]}#{pane_index}#[nobold] #[fg=#4f6a52]#{pane_current_command}#{?@area, · #{@area},} #[fg=#{?@area_color,#{@area_color},#1c2a1e}]├"

# status line
set -g status-style "bg=#070d08,fg=#9aa0ba"
set -g status-left "#[bg=#b9ff3c,fg=#000000,bold] #S #[default] "
set -g status-right "#[fg=#3cffd9,bold]⚡ #{alert_count} #[fg=#1c2a1e]│#[default] #{b:pane_current_path} #[fg=#1c2a1e]│ #[fg=#d9dcea]%d %b %H:%M "
set -g window-status-style "fg=#9aa0ba"
set -g window-status-current-style "fg=#b9ff3c,bold"
set -g window-status-last-style "fg=#9aa0ba"
set -g window-status-bell-style "fg=#ffc63a,bold"
set -g window-status-activity-style "fg=#7dff5c"

# messages, prompts, modes, menus
set -g message-style "bg=#070d08,fg=#b9ff3c"
set -g message-command-style "bg=#070d08,fg=#3cffd9"
set -g mode-style "bg=#3cffd9,fg=#000000"
set -g clock-mode-colour "#b9ff3c"
set -g display-panes-active-colour "#b9ff3c"
set -g display-panes-colour "#4f6a52"
set -g popup-border-style "fg=#b9ff3c"
set -g menu-style "bg=#070d08,fg=#d9dcea"
set -g menu-border-style "fg=#3cffd9"
set -g menu-selected-style "bg=#b9ff3c,fg=#000000"

# sidebar
set -g sidebar-style "bg=#070d08,fg=#d9dcea"
set -g sidebar-accent "#b9ff3c"
set -g sidebar-accent2 "#3cffd9"
set -g sidebar-dim "#4f6a52"
set -g sidebar-ok "#7dff5c"
set -g sidebar-warn "#ffc63a"
set -g sidebar-error "#ff4f6d"
