# amux palette "sunset" — orange / pink on plum
# Switch live with prefix+T, or: tmux source-file ~/amux/themes/sunset.conf

# Colour variables for your own formats: #{@amux_a1}, #{@amux_a2}, #{@amux_dim},
# #{@amux_dim2}, #{@amux_fg}, #{@amux_fg2}, #{@amux_panel}, #{@amux_bg}
set -g @amux_palette "sunset"
set -g @amux_a1 "#ff8f3c"
set -g @amux_a2 "#ff3c7e"
set -g @amux_bg "#150a16"
set -g @amux_panel "#110812"
set -g @amux_dim "#6b5470"
set -g @amux_dim2 "#2c1d30"
set -g @amux_fg "#d9dcea"
set -g @amux_fg2 "#9aa0ba"

# panes
set -g window-style "bg=#150a16,fg=#d9dcea"
set -g window-active-style "bg=#150a16,fg=#d9dcea"
set -g pane-border-style "fg=#{?@area_color,#{@area_color},#2c1d30}"
set -g pane-active-border-style "fg=#{?@area_color,#{@area_color},#ff8f3c}"
set -g pane-border-format "#[fg=#{?@area_color,#{@area_color},#2c1d30}]┤ #{?pane_active,#[fg=#ff8f3c]#[bold],#[fg=#9aa0ba]}#{pane_index}#[nobold] #[fg=#6b5470]#{pane_current_command}#{?@area, · #{@area},} #[fg=#{?@area_color,#{@area_color},#2c1d30}]├"

# status line
set -g status-style "bg=#110812,fg=#9aa0ba"
set -g status-left "#[bg=#ff8f3c,fg=#000000,bold] #S #[default] "
set -g status-right "#[fg=#ff3c7e,bold]⚡ #{alert_count} #[fg=#2c1d30]│#[default] #{b:pane_current_path} #[fg=#2c1d30]│ #[fg=#d9dcea]%d %b %H:%M "
set -g window-status-style "fg=#9aa0ba"
set -g window-status-current-style "fg=#ff8f3c,bold"
set -g window-status-last-style "fg=#9aa0ba"
set -g window-status-bell-style "fg=#ffc63a,bold"
set -g window-status-activity-style "fg=#7dff5c"

# messages, prompts, modes, menus
set -g message-style "bg=#110812,fg=#ff8f3c"
set -g message-command-style "bg=#110812,fg=#ff3c7e"
set -g mode-style "bg=#ff3c7e,fg=#000000"
set -g clock-mode-colour "#ff8f3c"
set -g display-panes-active-colour "#ff8f3c"
set -g display-panes-colour "#6b5470"
set -g popup-border-style "fg=#ff8f3c"
set -g menu-style "bg=#110812,fg=#d9dcea"
set -g menu-border-style "fg=#ff3c7e"
set -g menu-selected-style "bg=#ff8f3c,fg=#000000"

# sidebar
set -g sidebar-style "bg=#110812,fg=#d9dcea"
set -g sidebar-accent "#ff8f3c"
set -g sidebar-accent2 "#ff3c7e"
set -g sidebar-dim "#6b5470"
set -g sidebar-ok "#7dff5c"
set -g sidebar-warn "#ffc63a"
set -g sidebar-error "#ff4f6d"
