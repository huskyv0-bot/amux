# amux palette "ultra" — violet / sky on indigo
# Switch live with prefix+T, or: tmux source-file ~/amux/themes/ultra.conf

# Colour variables for your own formats: #{@amux_a1}, #{@amux_a2}, #{@amux_dim},
# #{@amux_dim2}, #{@amux_fg}, #{@amux_fg2}, #{@amux_panel}, #{@amux_bg}
set -g @amux_palette "ultra"
set -g @amux_a1 "#b07cff"
set -g @amux_a2 "#3ce9ff"
set -g @amux_bg "#0e0a18"
set -g @amux_panel "#0b0813"
set -g @amux_dim "#5a5178"
set -g @amux_dim2 "#241f3a"
set -g @amux_fg "#d9dcea"
set -g @amux_fg2 "#9aa0ba"

# panes
set -g window-style "bg=#0e0a18,fg=#d9dcea"
set -g window-active-style "bg=#0e0a18,fg=#d9dcea"
set -g pane-border-style "fg=#{?@area_color,#{@area_color},#241f3a}"
set -g pane-active-border-style "fg=#{?@area_color,#{@area_color},#b07cff}"
set -g pane-border-format "#[fg=#{?@area_color,#{@area_color},#241f3a}]┤ #{?pane_active,#[fg=#b07cff]#[bold],#[fg=#9aa0ba]}#{pane_index}#[nobold] #[fg=#5a5178]#{pane_current_command}#{?@area, · #{@area},} #[fg=#{?@area_color,#{@area_color},#241f3a}]├"

# status line
set -g status-style "bg=#0b0813,fg=#9aa0ba"
set -g status-left "#[bg=#b07cff,fg=#000000,bold] #S #[default] "
set -g status-right "#[fg=#3ce9ff,bold]⚡ #{alert_count} #[fg=#241f3a]│#[default] #{b:pane_current_path} #[fg=#241f3a]│ #[fg=#d9dcea]%d %b %H:%M "
set -g window-status-style "fg=#9aa0ba"
set -g window-status-current-style "fg=#b07cff,bold"
set -g window-status-last-style "fg=#9aa0ba"
set -g window-status-bell-style "fg=#ffc63a,bold"
set -g window-status-activity-style "fg=#7dff5c"

# messages, prompts, modes, menus
set -g message-style "bg=#0b0813,fg=#b07cff"
set -g message-command-style "bg=#0b0813,fg=#3ce9ff"
set -g mode-style "bg=#3ce9ff,fg=#000000"
set -g clock-mode-colour "#b07cff"
set -g display-panes-active-colour "#b07cff"
set -g display-panes-colour "#5a5178"
set -g popup-border-style "fg=#b07cff"
set -g menu-style "bg=#0b0813,fg=#d9dcea"
set -g menu-border-style "fg=#3ce9ff"
set -g menu-selected-style "bg=#b07cff,fg=#000000"

# sidebar
set -g sidebar-style "bg=#0b0813,fg=#d9dcea"
set -g sidebar-accent "#b07cff"
set -g sidebar-accent2 "#3ce9ff"
set -g sidebar-dim "#5a5178"
set -g sidebar-ok "#7dff5c"
set -g sidebar-warn "#ffc63a"
set -g sidebar-error "#ff4f6d"
