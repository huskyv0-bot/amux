# amux palette "synth" — cyan / magenta on deep navy
# Switch live with prefix+T, or: tmux source-file ~/amux/themes/synth.conf

# Colour variables for your own formats: #{@amux_a1}, #{@amux_a2}, #{@amux_dim},
# #{@amux_dim2}, #{@amux_fg}, #{@amux_fg2}, #{@amux_panel}, #{@amux_bg}
set -g @amux_palette "synth"
set -g @amux_a1 "#22f3ff"
set -g @amux_a2 "#ff3ec9"
set -g @amux_bg "#0b0d19"
set -g @amux_panel "#0a0c16"
set -g @amux_dim "#555b7a"
set -g @amux_dim2 "#23273a"
set -g @amux_fg "#d9dcea"
set -g @amux_fg2 "#9aa0ba"

# panes
set -g window-style "bg=#0b0d19,fg=#d9dcea"
set -g window-active-style "bg=#0b0d19,fg=#d9dcea"
set -g pane-border-style "fg=#{?@area_color,#{@area_color},#23273a}"
set -g pane-active-border-style "fg=#{?@area_color,#{@area_color},#22f3ff}"
set -g pane-border-format "#[fg=#{?@area_color,#{@area_color},#23273a}]┤ #{?pane_active,#[fg=#22f3ff]#[bold],#[fg=#9aa0ba]}#{pane_index}#[nobold] #[fg=#555b7a]#{pane_current_command}#{?@area, · #{@area},} #[fg=#{?@area_color,#{@area_color},#23273a}]├"

# status line
set -g status-style "bg=#0a0c16,fg=#9aa0ba"
set -g status-left "#[bg=#22f3ff,fg=#000000,bold] #S #[default] "
set -g status-right "#[fg=#ff3ec9,bold]⚡ #{alert_count} #[fg=#23273a]│#[default] #{b:pane_current_path} #[fg=#23273a]│ #[fg=#d9dcea]%d %b %H:%M "
set -g window-status-style "fg=#9aa0ba"
set -g window-status-current-style "fg=#22f3ff,bold"
set -g window-status-last-style "fg=#9aa0ba"
set -g window-status-bell-style "fg=#ffc63a,bold"
set -g window-status-activity-style "fg=#7dff5c"

# messages, prompts, modes, menus
set -g message-style "bg=#0a0c16,fg=#22f3ff"
set -g message-command-style "bg=#0a0c16,fg=#ff3ec9"
set -g mode-style "bg=#ff3ec9,fg=#000000"
set -g clock-mode-colour "#22f3ff"
set -g display-panes-active-colour "#22f3ff"
set -g display-panes-colour "#555b7a"
set -g popup-border-style "fg=#22f3ff"
set -g menu-style "bg=#0a0c16,fg=#d9dcea"
set -g menu-border-style "fg=#ff3ec9"
set -g menu-selected-style "bg=#22f3ff,fg=#000000"

# sidebar
set -g sidebar-style "bg=#0a0c16,fg=#d9dcea"
set -g sidebar-accent "#22f3ff"
set -g sidebar-accent2 "#ff3ec9"
set -g sidebar-dim "#555b7a"
set -g sidebar-ok "#7dff5c"
set -g sidebar-warn "#ffc63a"
set -g sidebar-error "#ff4f6d"
