# amux theme — the look of the mockup.
#
# amux loads ~/.config/amux/amux.conf after ~/.tmux.conf. Put
#     source-file ~/amux/amux.conf
# in there (plus your own overrides) and only amux gets this look; a plain
# tmux never sees it.
#
# Colours live in themes/<palette>.conf (synth, acid, sunset, ultra). Switch
# live with prefix+T; the choice is remembered in ~/.config/amux/palette.conf.
# Your own formats can use the palette via #{@amux_a1}, #{@amux_a2},
# #{@amux_dim}, #{@amux_dim2}, #{@amux_fg}, #{@amux_fg2}, #{@amux_panel}.

# --- terminal -----------------------------------------------------------------
set -g default-terminal "tmux-256color"
# Trust that the outer terminal (and an outer tmux) can do RGB.
set -as terminal-features ",xterm*:RGB,tmux*:RGB,screen*:RGB"

# --- structure (no colours here) ---------------------------------------------
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-indicators off
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 80
set -g window-status-separator ""
set -g window-status-format " #I:#W#{?window_bell_flag,!,}#{?window_activity_flag,+,} "
set -g window-status-current-format " #I:#W* "
set -g popup-border-lines rounded
set -g sidebar on
set -g sidebar-position left
# set -g sidebar-width 48   # default 0 = automatic (22% of the terminal, 30-60 columns)

# --- palette ------------------------------------------------------------------
source-file ~/amux/themes/synth.conf
source-file -q ~/.config/amux/palette.conf

# prefix+T: pick a palette; it is applied live and remembered.
bind T display-menu -T "#[align=centre] amux palette " -x C -y C \
	"Synth   cyan / magenta"   s "run-shell 'mkdir -p ~/.config/amux && ln -sf ~/amux/themes/synth.conf ~/.config/amux/palette.conf' ; source-file ~/.config/amux/palette.conf ; source-file -q ~/.config/amux/amux.conf" \
	"Acid    lime / mint"      a "run-shell 'mkdir -p ~/.config/amux && ln -sf ~/amux/themes/acid.conf ~/.config/amux/palette.conf' ; source-file ~/.config/amux/palette.conf ; source-file -q ~/.config/amux/amux.conf" \
	"Sunset  orange / pink"    u "run-shell 'mkdir -p ~/.config/amux && ln -sf ~/amux/themes/sunset.conf ~/.config/amux/palette.conf' ; source-file ~/.config/amux/palette.conf ; source-file -q ~/.config/amux/amux.conf" \
	"Ultra   violet / sky"     l "run-shell 'mkdir -p ~/.config/amux && ln -sf ~/amux/themes/ultra.conf ~/.config/amux/palette.conf' ; source-file ~/.config/amux/palette.conf ; source-file -q ~/.config/amux/amux.conf"
